# Local development stack — your checkout is mounted, so edits show up without
# rebuilding or restarting anything:
#
#   PHP, Blade, routes, config   → next page load (opcache off)
#   CSS / JS / Blade              → instant via the Vite dev server (HMR / auto-reload)
#
#   docker compose -f docker-compose.dev.yml up -d      # http://localhost:8000
#   docker compose -f docker-compose.dev.yml logs -f
#   docker compose -f docker-compose.dev.yml exec app php artisan migrate
#   docker compose -f docker-compose.dev.yml down
#
# Uses the local .env (APP_ENV=local, SQLite in database/database.sqlite). Separate from
# docker-compose.yml, which is the production stack and needs database passwords.
# Only rebuild the image (`up -d --build`) after changing the Dockerfile.

services:
  app:
    build:
      context: .
      target: runtime
    image: library-gekophetweb/app:latest
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      SHOW_WELCOME_MESSAGE: "false"
      # The image caches compiled PHP without timestamp checks; off so edits are seen.
      PHP_OPCACHE_ENABLE: "0"
      # Run pending migrations on start; never cache config/routes/views in dev.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      AUTORUN_LARAVEL_EVENT_CACHE: "false"
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${DEV_APP_PORT:-8000}:8080"
    restart: unless-stopped

  vite:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_IN_DOCKER: "1"
    # Install inside the container: node_modules from Windows has the wrong native
    # binaries for Linux, so it lives in its own volume.
    # npm ci never rewrites package-lock.json; it runs only while the volume is empty.
    # After changing package.json: docker compose -f docker-compose.dev.yml run --rm vite npm ci
    command: ["sh", "-c", "[ -x node_modules/.bin/vite ] || npm ci --no-audit --no-fund; exec npm run dev"]
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

volumes:
  node-modules:
